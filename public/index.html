<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>掘進管理システム</title>
<style>
body{font-family:system-ui,"Yu Gothic",sans-serif;margin:0;background:#f6f7f9;color:#111}.wrap{max-width:1180px;margin:auto;padding:14px}h1{font-size:22px}.card{background:white;border:1px solid #ddd;border-radius:10px;padding:14px;margin:12px 0;box-shadow:0 1px 4px #0001}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}label{font-size:12px;font-weight:700}input,select,textarea,button{font:inherit;padding:9px;border:1px solid #bbb;border-radius:7px;box-sizing:border-box;width:100%}button{background:#123b6d;color:white;border:0;cursor:pointer}.btns{display:flex;gap:8px;flex-wrap:wrap}.btns button{width:auto}.tabs button{background:#ddd;color:#111}.tabs button.active{background:#123b6d;color:#fff}.hide{display:none}table{border-collapse:collapse;width:100%;background:white}th,td{border:1px solid #ccc;padding:6px;font-size:13px;text-align:center}th{background:#e8eef6;cursor:pointer}.scroll{overflow:auto}.small{font-size:12px;color:#555}.danger{background:#b3261e}.ok{background:#136f3a}.printOnly{display:none}.colorbox{height:36px;padding:2px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid,.grid2{grid-template-columns:1fr}.btns button{width:100%}}
@media print{body{background:white}.noPrint{display:none!important}.printOnly{display:block}.wrap{max-width:none;padding:0}.card{box-shadow:none;border:0;margin:0;padding:0}@page{size:A4 landscape;margin:5mm}.page{page-break-after:always}.page:last-child{page-break-after:auto}.printTable th,.printTable td{font-size:10px;padding:3px}.lubPrintTable th,.lubPrintTable td{font-size:10px;padding:4px}.lubPrintTable .remarks{min-width:150px;text-align:left}.headerbox td{font-size:13px;height:30px}}
</style></head><body><div class="wrap">
<div class="noPrint"><h1>掘進管理システム</h1>
<div class="card"><div class="grid2"><div><label>現場</label><select id="project"></select></div><div><label>現場追加</label><div style="display:flex;gap:8px"><input id="newProject" placeholder="現場名"><button onclick="addProject()">追加</button></div></div></div></div>
<div class="tabs btns"><button class="active" onclick="tab('main',this)">掘進管理</button><button onclick="tab('lub',this)">滑材注入管理</button><button onclick="tab('graph',this)">グラフ</button><button onclick="tab('settings',this)">設定</button></div>

<section id="main"><div class="card"><h2>掘進データ入力</h2><input type="hidden" id="rid"><div class="grid"><div><label>推進管No.</label><input id="pipe_no" type="number"></div><div><label>日時</label><input id="datetime" type="datetime-local"></div><div id="fieldInputs" class="grid" style="grid-column:1/-1"></div></div><br><div class="btns"><button onclick="saveRecord()">保存</button><button onclick="clearRecord()">新規</button><button onclick="printRecords('all')">一括印刷</button><button onclick="printByDay()">日報印刷</button><button onclick="printByRange()">管No範囲印刷</button><button onclick="location.href='/api/export/'+pid()">Excel出力</button><button onclick="location.href='/api/backup/'+pid()">現場バックアップ</button></div></div>
<div class="card"><h2>データ一覧 <span class="small">見出しクリックで並び替え</span></h2><div class="scroll"><table id="recordTable"></table></div></div></section>

<section id="lub" class="hide"><div class="card"><h2>滑材注入管理</h2><input type="hidden" id="lid"><div class="grid"><div><label>日付</label><input id="l_date" type="date"></div><div><label>注入管No.</label><input id="l_pipe_no"></div><div><label>注入量 ℓ</label><input id="l_injection_l" type="number" step="0.01"></div><div><label><span class="matName">材料</span> kg</label><input id="l_material_kg" type="number" step="0.01"></div><div><label>搬入量 kg</label><input id="l_delivery_kg" type="number" step="0.01"></div><div style="grid-column:span 2"><label>備考</label><input id="l_remarks"></div></div><br><div class="btns"><button onclick="saveLub()">保存</button><button onclick="clearLub()">新規</button><button onclick="printLub()">滑材表印刷</button></div></div><div class="card"><h2>滑材一覧</h2><div class="scroll"><table id="lubTable"></table></div></div></section>

<section id="graph" class="hide"><div class="card"><h2>入力値グラフ</h2><div class="grid"><div><label>横軸</label><select id="gx"><option value="pipe_no">推進管No.</option><option value="datetime">日付</option></select></div><div><label>表示値</label><select id="gy" multiple size="6"></select><span class="small">複数選択可</span></div><div id="gcolors" style="grid-column:span 2"></div></div><br><div class="btns"><button onclick="drawGraph()">グラフ表示</button><button onclick="downloadSvg()">SVG保存</button></div><div class="scroll"><svg id="chart" width="1100" height="520" style="background:white;border:1px solid #ccc;margin-top:10px"></svg></div></div></section>

<section id="settings" class="hide"><div class="card"><h2>印刷様式設定</h2><div class="grid"><div><label>帳票タイトル</label><input id="title"></div><div><label>工事名</label><input id="work_name"></div><div><label>施工者</label><input id="contractor"></div><div><label>スパン名</label><input id="span_name"></div><div><label>管径</label><input id="diameter"></div><div><label>推進距離</label><input id="drive_distance"></div><div><label>記入者</label><input id="writer"></div><div><label>滑材 材料名</label><input id="material_name"></div><div><label>右下ロゴ</label><input type="file" id="logoFile" accept="image/*"></div></div><br><button onclick="saveSettings()">設定保存</button></div><div class="card"><h2>項目名・単位・表示順</h2><div class="scroll"><table id="fieldTable"></table></div><br><button onclick="saveSettings()">項目設定保存</button></div></section>
</div><div id="printArea" class="printOnly"></div></div>
<script>
let projects=[], settings={}, records=[], lubs=[], sortKey='datetime', sortAsc=true;
const baseFields=[['face_pressure','切羽土圧','MPa'],['water_pressure','送水圧','MPa'],['slurry_flow','排泥流量','m³/分'],['speed','掘進速度','cm/分'],['thrust','元押し推力','kN'],['cutter_torque','カッタートルク','A'],['pump_p1','送泥P1ポンプ','rpm'],['pump_p2','排泥P2ポンプ','rpm'],['pump_p3','排泥P3ポンプ','rpm'],['pump_p4','排泥P4ポンプ','rpm'],['pitching','ピッチング','±'],['rolling','ローリング','±'],['viscosity','粘性','秒'],['specific_gravity','比重',''],['soil_amount','残土量','m³'],['accuracy_center','推進精度センター','mm'],['accuracy_level','推進精度レベル','mm'],['remarks','特記事項','']];
const $=id=>document.getElementById(id), pid=()=>$('project').value, api=(u,o)=>fetch(u,o).then(r=>r.json());
function tab(id,btn){document.querySelectorAll('section').forEach(s=>s.classList.add('hide'));$(id).classList.remove('hide');document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active'); if(id==='graph') setupGraph();}
async function init(){projects=await api('/api/projects'); $('project').innerHTML=projects.map(p=>`<option value="${p.id}">${p.name}</option>`).join(''); $('project').onchange=loadAll; await loadAll();}
async function addProject(){let name=$('newProject').value.trim(); if(!name)return; let p=await api('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})}); projects.push(p); $('project').innerHTML=projects.map(x=>`<option value="${x.id}">${x.name}</option>`).join(''); $('project').value=p.id; await loadAll();}
async function loadAll(){settings=await api('/api/settings/'+pid()); records=await api('/api/records/'+pid()); lubs=await api('/api/lubricant/'+pid()); renderForm(); renderRecords(); renderSettings(); renderLub(); setupGraph(); clearRecord();}
function fs(){return (settings.fields||[]).slice().sort((a,b)=>(+a.order)-(+b.order))}
function val(v){return v==null?'':v} function dateOnly(x){return x?x.replaceAll('-','/').slice(0,10):''} function dt(x){return x?x.replace('T',' ').replaceAll('-','/').slice(0,16):''}
function renderForm(){let h=''; fs().filter(f=>f.show).forEach(f=>{h+=`<div><label>${f.label}${f.unit?'（'+f.unit+'）':''}</label>${f.key==='remarks'?`<textarea id="${f.key}"></textarea>`:`<input id="${f.key}" type="number" step="0.01">`}</div>`}); $('fieldInputs').innerHTML=h;}
function renderRecords(){let fields=fs().filter(f=>f.show); let arr=records.slice().sort((a,b)=>{let av=a[sortKey],bv=b[sortKey]; if(!isNaN(Number(av))&&!isNaN(Number(bv))){av=Number(av)||0;bv=Number(bv)||0} return (av>bv?1:av<bv?-1:0)*(sortAsc?1:-1)}); let h='<tr><th onclick="sortBy(\'pipe_no\')">推進管No.</th><th onclick="sortBy(\'datetime\')">日時</th>'+fields.map(f=>`<th onclick="sortBy('${f.key}')">${f.label}</th>`).join('')+'<th>操作</th></tr>'; arr.forEach(r=>{h+=`<tr><td>${val(r.pipe_no)}</td><td>${dt(r.datetime)}</td>`+fields.map(f=>`<td>${val(r[f.key])}</td>`).join('')+`<td><button onclick="editRecord(${r.id})">編集</button><button class="danger" onclick="delRecord(${r.id})">削除</button></td></tr>`}); $('recordTable').innerHTML=h;}
function sortBy(k){sortAsc=sortKey===k?!sortAsc:true; sortKey=k; renderRecords();}
async function clearRecord(){$('rid').value=''; let nx=await api('/api/next-pipe/'+pid()); $('pipe_no').value=nx.next; $('datetime').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16); fs().forEach(f=>{let e=$(f.key); if(e)e.value=''});}
function editRecord(id){let r=records.find(x=>x.id==id); if(!r)return; $('rid').value=r.id;$('pipe_no').value=val(r.pipe_no);$('datetime').value=(r.datetime||'').slice(0,16);fs().forEach(f=>{let e=$(f.key); if(e)e.value=val(r[f.key])});scrollTo(0,0)}
async function saveRecord(){let b={id:$('rid').value?Number($('rid').value):null,pipe_no:$('pipe_no').value,datetime:$('datetime').value}; fs().forEach(f=>{let e=$(f.key); if(e)b[f.key]=e.value}); await api('/api/records/'+pid(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}); await loadAll();}
async function delRecord(id){if(confirm('削除しますか？')){await api('/api/records/'+id,{method:'DELETE'}); await loadAll();}}
function renderSettings(){let ps=settings.projectSettings||{}, ls=settings.lubricantSettings||{}; ['title','work_name','contractor','span_name','diameter','drive_distance','writer'].forEach(k=>$(k).value=ps[k]||''); $('material_name').value=ls.material_name||'滑材'; document.querySelectorAll('.matName').forEach(x=>x.textContent=$('material_name').value); let h='<tr><th>順</th><th>項目名</th><th>単位</th><th>入力表示</th><th>印刷</th></tr>'; fs().forEach(f=>h+=`<tr data-key="${f.key}"><td><input value="${f.order}" class="forder" type="number"></td><td><input value="${f.label}" class="flabel"></td><td><input value="${f.unit}" class="funit"></td><td><input type="checkbox" class="fshow" ${f.show?'checked':''}></td><td><input type="checkbox" class="fprint" ${f.print?'checked':''}></td></tr>`); $('fieldTable').innerHTML=h;}
$('logoFile').addEventListener('change',e=>{let f=e.target.files[0]; if(!f)return; let r=new FileReader(); r.onload=()=>{settings.projectSettings.logo=r.result}; r.readAsDataURL(f)});
async function saveSettings(){let ps=settings.projectSettings||{}; ['title','work_name','contractor','span_name','diameter','drive_distance','writer'].forEach(k=>ps[k]=$(k).value); let rows=[...document.querySelectorAll('#fieldTable tr[data-key]')]; let fields=rows.map(tr=>({key:tr.dataset.key,order:Number(tr.querySelector('.forder').value)||1,label:tr.querySelector('.flabel').value,unit:tr.querySelector('.funit').value,show:tr.querySelector('.fshow').checked,print:tr.querySelector('.fprint').checked})); await api('/api/settings/'+pid(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({projectSettings:ps,fields,lubricantSettings:{material_name:$('material_name').value}})}); await loadAll();}
function printRecords(mode,filter){let data=records.slice(); if(filter)data=data.filter(filter); data.sort((a,b)=>(a.datetime||'').localeCompare(b.datetime||'')||(+a.pipe_no)-(+b.pipe_no)); let f=fs().filter(x=>x.print); let ps=settings.projectSettings||{}; let pages=[]; for(let i=0;i<data.length;i+=10){let chunk=data.slice(i,i+10); let h=`<div class="page"><h2 style="text-align:center">${ps.title||'泥水式推進工データー表'}</h2><table class="headerbox"><tr><td>工事名</td><td colspan="3">${ps.work_name||''}</td><td>記入者</td><td>${ps.writer||''}</td></tr><tr><td>施工者</td><td colspan="3">${ps.contractor||''}</td><td>スパン名</td><td>${ps.span_name||''}</td></tr><tr><td>管径</td><td>${ps.diameter||''}</td><td>推進距離</td><td>${ps.drive_distance||''}</td><td></td><td></td></tr></table><table class="printTable"><tr><th>項目</th>${chunk.map(r=>`<th>${val(r.pipe_no)}</th>`).join('')}</tr><tr><th>日付</th>${chunk.map(r=>`<td>${dt(r.datetime)}</td>`).join('')}</tr>`; f.forEach(x=>h+=`<tr><th>${x.label}${x.unit?' '+x.unit:''}</th>${chunk.map(r=>`<td>${val(r[x.key])}</td>`).join('')}</tr>`); h+=`</table>${ps.logo?`<img src="${ps.logo}" style="float:right;max-width:120px;max-height:60px;margin-top:6px">`:''}</div>`; pages.push(h)} $('printArea').innerHTML=pages.join(''); window.print();}
function printByDay(){let d=prompt('印刷する日付 yyyy-mm-dd'); if(d)printRecords('day',r=>(r.datetime||'').slice(0,10)===d.replaceAll('/','-'))}
function printByRange(){let a=Number(prompt('開始 管No.')), b=Number(prompt('終了 管No.')); if(!isNaN(a)&&!isNaN(b))printRecords('range',r=>Number(r.pipe_no)>=a&&Number(r.pipe_no)<=b)}
function lubCalc(arr){let dayInj={},dayMat={},ti=0,tm=0,td=0; return arr.map(r=>{let inj=Number(r.injection_l)||0, mat=Number(r.material_kg)||0, del=Number(r.delivery_kg)||0; ti+=inj;tm+=mat;td+=del;dayInj[r.date]=(dayInj[r.date]||0)+inj;dayMat[r.date]=(dayMat[r.date]||0)+mat;return {...r,dayInj:dayInj[r.date],totalInj:ti,dayMat:dayMat[r.date],totalMat:tm,totalDel:td,remain:td-tm}})}
function renderLub(){document.querySelectorAll('.matName').forEach(x=>x.textContent=(settings.lubricantSettings||{}).material_name||'材料'); let arr=lubCalc(lubs.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''))); let h='<tr><th>日付</th><th>注入管No.</th><th>注入量ℓ</th><th>日注入合計ℓ</th><th>全体累計ℓ</th><th>材料kg</th><th>日材料合計kg</th><th>累計使用kg</th><th>搬入量kg</th><th>総搬入kg</th><th>残数量kg</th><th>備考</th><th>操作</th></tr>'; arr.forEach(r=>h+=`<tr><td>${dateOnly(r.date)}</td><td>${val(r.pipe_no)}</td><td>${val(r.injection_l)}</td><td>${r.dayInj}</td><td>${r.totalInj}</td><td>${val(r.material_kg)}</td><td>${r.dayMat}</td><td>${r.totalMat}</td><td>${val(r.delivery_kg)}</td><td>${r.totalDel}</td><td>${r.remain}</td><td>${val(r.remarks)}</td><td><button onclick="editLub(${r.id})">編集</button><button class="danger" onclick="delLub(${r.id})">削除</button></td></tr>`); $('lubTable').innerHTML=h;}
function clearLub(){['lid','l_pipe_no','l_injection_l','l_material_kg','l_delivery_kg','l_remarks'].forEach(id=>$(id).value=''); $('l_date').value=new Date().toISOString().slice(0,10)}
function editLub(id){let r=lubs.find(x=>x.id==id); if(!r)return; $('lid').value=r.id;$('l_date').value=r.date;$('l_pipe_no').value=r.pipe_no;$('l_injection_l').value=val(r.injection_l);$('l_material_kg').value=val(r.material_kg);$('l_delivery_kg').value=val(r.delivery_kg);$('l_remarks').value=val(r.remarks);}
async function saveLub(){let b={id:$('lid').value?Number($('lid').value):null,date:$('l_date').value,pipe_no:$('l_pipe_no').value,injection_l:$('l_injection_l').value,material_kg:$('l_material_kg').value,delivery_kg:$('l_delivery_kg').value,remarks:$('l_remarks').value}; await api('/api/lubricant/'+pid(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}); await loadAll(); clearLub();}
async function delLub(id){if(confirm('削除しますか？')){await api('/api/lubricant/'+id,{method:'DELETE'}); await loadAll();}}
function printLub(){let ps=settings.projectSettings||{}, mat=(settings.lubricantSettings||{}).material_name||'材料'; let arr=lubCalc(lubs.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''))); let h=`<div class="page"><h2 style="text-align:center">滑材注入管理表</h2><div>工事名：${ps.work_name||''}　施工者：${ps.contractor||''}</div><table class="lubPrintTable"><tr><th>日付</th><th>注入管No.</th><th>注入量ℓ</th><th>日注入合計ℓ</th><th>全体累計ℓ</th><th>${mat} kg</th><th>日材料合計kg</th><th>累計使用kg</th><th>搬入量kg</th><th>総搬入kg</th><th>残数量kg</th><th class="remarks">備考</th></tr>`; arr.forEach(r=>h+=`<tr><td>${dateOnly(r.date)}</td><td>${val(r.pipe_no)}</td><td>${val(r.injection_l)}</td><td>${r.dayInj}</td><td>${r.totalInj}</td><td>${val(r.material_kg)}</td><td>${r.dayMat}</td><td>${r.totalMat}</td><td>${val(r.delivery_kg)}</td><td>${r.totalDel}</td><td>${r.remain}</td><td class="remarks">${val(r.remarks)}</td></tr>`); h+=`</table>${ps.logo?`<div style="text-align:right;margin-top:8px"><img src="${ps.logo}" style="max-width:120px;max-height:60px"></div>`:''}</div>`; $('printArea').innerHTML=h; window.print();}
function setupGraph(){let opts=fs().filter(f=>f.key!=='remarks').map(f=>`<option value="${f.key}">${f.label}${f.unit?'（'+f.unit+'）':''}</option>`).join(''); if($('gy').innerHTML!==opts)$('gy').innerHTML=opts; buildColorInputs();}
$('gy').addEventListener('change',buildColorInputs);
function selectedY(){return [...$('gy').selectedOptions].map(o=>o.value)}
function colorFor(k,i){let e=$('color_'+k); return e?e.value:['#e53935','#1e88e5','#43a047','#fb8c00','#8e24aa'][i%5]}
function buildColorInputs(){let h=''; selectedY().forEach((k,i)=>{let f=fs().find(x=>x.key===k); h+=`<label>${f?f.label:k} 色</label><input class="colorbox" type="color" id="color_${k}" value="${colorFor(k,i)}">`}); $('gcolors').innerHTML=h||'<span class="small">表示値を選択すると色を指定できます。</span>'}
function drawGraph(){
  const svg=$('chart'), W=1100,H=520, m={l:70,r:25,t:35,b:70};
  const ys=selectedY();
  if(!ys.length){svg.innerHTML='<text x="30" y="50">表示する値を選択してください</text>'; return}
  const data=records.slice().sort((a,b)=>$('gx').value==='pipe_no'?(Number(a.pipe_no)||0)-(Number(b.pipe_no)||0):(a.datetime||'').localeCompare(b.datetime||''));
  if(!data.length){svg.innerHTML='<text x="30" y="50">データがありません</text>'; return}
  const vals=[];
  ys.forEach(k=>data.forEach(r=>{const v=Number(r[k]); if(Number.isFinite(v)) vals.push(v)}));
  if(!vals.length){svg.innerHTML='<text x="30" y="50">選択項目に数値データがありません</text>'; return}
  let ymin=Math.min(0,...vals), ymax=Math.max(1,...vals);
  if(ymin===ymax){ymin-=1; ymax+=1;}
  const x=i=>m.l+(data.length<=1?0:i*(W-m.l-m.r)/(data.length-1));
  const y=v=>H-m.b-(v-ymin)*(H-m.t-m.b)/(ymax-ymin);
  const out=[];
  const line=(x1,y1,x2,y2,c,w=1)=>out.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}"/>`);
  line(m.l,m.t,m.l,H-m.b,'#333'); line(m.l,H-m.b,W-m.r,H-m.b,'#333');
  for(let i=0;i<=5;i++){const vv=ymin+(ymax-ymin)*i/5, yy=y(vv); line(m.l,yy,W-m.r,yy,'#ddd'); out.push(`<text x="8" y="${yy+4}" font-size="12">${vv.toFixed(1)}</text>`)}
  const step=Math.max(1,Math.ceil(data.length/12));
  data.forEach((r,i)=>{if(i%step===0){const tx=$('gx').value==='pipe_no'?val(r.pipe_no):dateOnly(r.datetime); out.push(`<text x="${x(i)-20}" y="${H-35}" font-size="11" transform="rotate(35 ${x(i)-20},${H-35})">${tx}</text>`)}});
  ys.forEach((k,idx)=>{
    const pts=data.map((r,i)=>({x:x(i),y:y(Number(r[k])),v:Number(r[k])})).filter(p=>Number.isFinite(p.v));
    const c=colorFor(k,idx);
    for(let i=1;i<pts.length;i++) line(pts[i-1].x,pts[i-1].y,pts[i].x,pts[i].y,c,2);
    pts.forEach(p=>out.push(`<circle cx="${p.x}" cy="${p.y}" r="3" fill="${c}"/>`));
    const f=fs().find(x=>x.key===k);
    out.push(`<rect x="${W-190}" y="${20+idx*22}" width="12" height="12" fill="${c}"/><text x="${W-172}" y="${31+idx*22}" font-size="13">${f?f.label:k}</text>`);
  });
  out.push(`<text x="${W/2-60}" y="22" font-size="16">掘進データグラフ</text><text x="12" y="18" font-size="12">縦軸：選択値</text>`);
  svg.innerHTML=out.join('');
}
function downloadSvg(){let blob=new Blob([$('chart').outerHTML],{type:'image/svg+xml'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='graph.svg';a.click();}
init();
</script></body></html>
