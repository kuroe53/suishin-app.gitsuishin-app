<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>掘進管理システム</title>
<style>
body{font-family:system-ui,"Yu Gothic",sans-serif;margin:0;background:#f5f6f8;color:#222}.wrap{max-width:1200px;margin:auto;padding:14px}
.card{background:white;border:1px solid #ddd;border-radius:10px;padding:14px;margin:12px 0;box-shadow:0 1px 3px #0001}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
label{font-size:12px;font-weight:bold}input,select,textarea,button{box-sizing:border-box;width:100%;padding:9px;border:1px solid #bbb;border-radius:6px;font-size:15px}button{cursor:pointer;background:#1f6feb;color:white;border:0;font-weight:bold}.sub{background:#555}.danger{background:#c33}
.tab{width:auto;padding:10px 14px;margin-right:6px;background:#555}.tab.active{background:#1f6feb}
table{border-collapse:collapse;width:100%;background:white}th,td{border:1px solid #ccc;padding:6px;text-align:center;font-size:13px}th{background:#eee}.scroll{overflow:auto}.hide{display:none}.small{font-size:12px;color:#666}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}.row>*{width:100%}input,button,select{font-size:17px;padding:12px}}
.printOnly{display:none}
@media print{
body{background:white}.wrap>*:not(.printOnly){display:none!important}.printOnly{display:block!important}.page{page-break-after:always;width:287mm;min-height:200mm;margin:0 auto;background:white}.noBreak{page-break-inside:avoid}
@page{size:A4 landscape;margin:5mm}table.printtbl th,table.printtbl td{border:1.8px solid #111;padding:3px;font-size:9.5px;line-height:1.15}.print-title{text-align:center;font-size:22px;margin:5mm 0 5mm}.headgrid{display:grid;grid-template-columns:1.2fr 1fr .3fr;gap:8mm;align-items:start}.box th,.box td{font-size:13px!important;padding:5px!important}.logo{max-width:38mm;max-height:15mm;float:right;margin-top:3mm}.lubPage{width:287mm}.lubPage table th,.lubPage table td{font-size:10px;padding:4px}
}
</style></head><body><div class="wrap">
<h2>掘進管理システム</h2>
<div class="card row"><div><label>現場</label><select id="project"></select></div><div><label>新規現場名</label><input id="newProject"></div><button onclick="addProject()" style="width:150px">現場追加</button></div>
<div><button class="tab active" onclick="showTab('main',this)">掘進管理</button><button class="tab" onclick="showTab('lub',this)">滑材注入管理</button><button class="tab" onclick="showTab('set',this)">様式・項目設定</button></div>

<section id="main" class="card">
<h3>掘進データ入力</h3><input type="hidden" id="rid">
<div class="grid" id="recordForm"></div>
<div class="row" style="margin-top:10px"><button onclick="saveRecord()" style="width:130px">保存</button><button class="sub" onclick="clearRecord()" style="width:130px">新規</button><button onclick="printRecords('all')" style="width:130px">一括印刷</button><button onclick="printRecords('day')" style="width:130px">日報印刷</button><button onclick="printRecords('range')" style="width:160px">管No範囲印刷</button><button onclick="location.href='/api/export/excel?project_id='+pid()" style="width:130px">Excel出力</button><button class="sub" onclick="location.href='/api/backup?project_id='+pid()" style="width:150px">現場バックアップ</button></div>
<h3>一覧</h3><div class="scroll"><table id="recordsTable"></table></div>
</section>

<section id="lub" class="card hide">
<h3>滑材注入管理</h3>
<div class="grid">
<div><label>日時</label><input type="datetime-local" id="l_date"></div><div><label>注入管No.</label><input id="l_pipe"></div><div><label>注入量 ℓ</label><input type="number" step="any" id="l_liter"></div><div><label id="l_mat_label">材料 kg</label><input type="number" step="any" id="l_mat"></div><div><label>搬入量 kg</label><input type="number" step="any" id="l_del"></div><div><label>備考</label><input id="l_remarks"></div>
</div><div class="row" style="margin-top:10px"><button onclick="saveLub()" style="width:130px">保存</button><button onclick="printLub()" style="width:130px">滑材表印刷</button><button onclick="location.href='/api/export/excel?project_id='+pid()" style="width:130px">Excel出力</button></div>
<h3>滑材一覧・集計</h3><div class="scroll"><table id="lubTable"></table></div>
</section>

<section id="set" class="card hide"><h3>様式設定</h3>
<div class="grid">
<div><label>帳票タイトル</label><input id="report_title"></div><div><label>工事名</label><input id="construction_name"></div><div><label>施工者</label><input id="contractor"></div><div><label>スパン名</label><input id="span_name"></div><div><label>管径</label><input id="pipe_diameter"></div><div><label>推進距離</label><input id="drive_distance"></div><div><label>記入者</label><input id="writer"></div><div><label>滑材 材料名</label><input id="lubricant_material_name"></div><div><label>右下ロゴ画像</label><input type="file" id="logoFile" accept="image/*"></div></div>
<p class="small">ロゴ画像は保存時に取り込みます。</p><button onclick="saveSettings()" style="width:180px">様式設定を保存</button>
<h3>項目名・単位・並び順</h3><div id="itemsBox" class="scroll"></div><button onclick="saveItems()" style="width:160px;margin-top:10px">項目設定を保存</button>
</section>

<div id="printArea" class="printOnly"></div>
</div>
<script>
let projects=[], settings={}, items=[], records=[], lubs=[];
const baseFields=['kafuatsu','sousui','hainyu_flow','kusshin_speed','motooshi_force','cutter_torque','souden_p1','haiden_p2','haiden_p3','haiden_p4','pitching','rolling','viscosity','specific_gravity','zando'];
function pid(){return document.getElementById('project').value||1}
function q(id){return document.getElementById(id)}
function fmtDT(s){if(!s)return''; let t=s.replace('T',' '); return t.slice(0,16).replaceAll('-','/')}
function todayDT(){let d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16)}
async function api(u,o){let r=await fetch(u,o); if(!r.ok){let t=await r.text(); throw new Error(t)} return r.json()}
function showTab(id,btn){document.querySelectorAll('section').forEach(s=>s.classList.add('hide'));q(id).classList.remove('hide');document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}
async function loadProjects(){projects=await api('/api/projects'); q('project').innerHTML=projects.map(p=>`<option value="${p.id}">${p.name}</option>`).join(''); q('project').onchange=loadAll; await loadAll()}
async function addProject(){let name=q('newProject').value.trim(); if(!name)return alert('現場名を入力してください'); let p=await api('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})}); await loadProjects(); q('project').value=p.id; q('newProject').value=''; await loadAll()}
async function loadAll(){let d=await api('/api/projects/'+pid()+'/settings'); settings=d.settings||{}; items=d.items||[]; fillSettings(); buildForm(); await clearRecord(); await loadRecords(); await loadLub();}
function item(k){return items.find(x=>x.field_key===k)||{label:k,unit:'',visible:1,print_visible:1,sort_order:0}}
function label(k){let it=item(k); return it.label+(it.unit?'（'+it.unit+'）':'')}
function fillSettings(){['report_title','construction_name','contractor','span_name','pipe_diameter','drive_distance','writer','lubricant_material_name'].forEach(k=>q(k).value=settings[k]||''); q('l_mat_label').textContent=(settings.lubricant_material_name||'材料')+' kg'; buildItemsBox()}
function buildForm(){let html=`<div><label>推進管No.</label><input id="pipe_no" type="number"></div><div><label>日時</label><input id="date" type="datetime-local"></div>`; items.filter(x=>x.visible&&baseFields.includes(x.field_key)).sort((a,b)=>a.sort_order-b.sort_order).forEach(it=>html+=`<div><label>${it.label}${it.unit?'（'+it.unit+'）':''}</label><input id="${it.field_key}" type="number" step="any"></div>`); html+=`<div><label>センター方向</label><select id="precision_center_direction"><option></option><option>右</option><option>左</option></select></div><div><label>${label('precision_center')}</label><input id="precision_center_value" type="number" step="any"></div><div><label>レベル方向</label><select id="precision_level_direction"><option></option><option>上</option><option>下</option></select></div><div><label>${label('precision_level')}</label><input id="precision_level_value" type="number" step="any"></div><div style="grid-column:1/-1"><label>${item('remarks').label||'特記事項'}</label><textarea id="remarks"></textarea></div>`; q('recordForm').innerHTML=html}
async function clearRecord(){q('rid').value=''; [...baseFields,'precision_center_value','precision_level_value','remarks'].forEach(k=>{let e=q(k); if(e)e.value=''}); q('date').value=todayDT(); let n=await api('/api/records/next-pipe-no?project_id='+pid()); q('pipe_no').value=n.next_no||1; q('precision_center_direction').value=''; q('precision_level_direction').value=''}
async function saveRecord(){let b={project_id:pid(),pipe_no:q('pipe_no').value,date:q('date').value,precision_center_direction:q('precision_center_direction').value,precision_level_direction:q('precision_level_direction').value,remarks:q('remarks').value}; [...baseFields,'precision_center_value','precision_level_value'].forEach(k=>b[k]=q(k)?.value||''); let id=q('rid').value; await api('/api/records'+(id?'/'+id:''),{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}); await clearRecord(); await loadRecords()}
async function loadRecords(){records=await api('/api/records?project_id='+pid()); let hs=['操作','推進管No.','日時',...items.filter(x=>x.visible&&baseFields.includes(x.field_key)).sort((a,b)=>a.sort_order-b.sort_order).map(x=>x.label),'センター','レベル','特記事項']; let html='<tr>'+hs.map(h=>`<th>${h}</th>`).join('')+'</tr>'; records.forEach(r=>{html+='<tr><td><button onclick="editRecord('+r.id+')" style="padding:4px">編集</button><button class="danger" onclick="delRecord('+r.id+')" style="padding:4px">削除</button></td><td>'+ (r.pipe_no??'')+'</td><td>'+fmtDT(r.date)+'</td>'; items.filter(x=>x.visible&&baseFields.includes(x.field_key)).sort((a,b)=>a.sort_order-b.sort_order).forEach(it=>html+='<td>'+(r[it.field_key]??'')+'</td>'); html+=`<td>${r.precision_center_direction||''}${r.precision_center_value??''}</td><td>${r.precision_level_direction||''}${r.precision_level_value??''}</td><td>${r.remarks||''}</td></tr>`}); q('recordsTable').innerHTML=html}
function editRecord(id){let r=records.find(x=>x.id===id); if(!r)return; q('rid').value=id; ['pipe_no','date','precision_center_direction','precision_level_direction','remarks',...baseFields,'precision_center_value','precision_level_value'].forEach(k=>{let e=q(k); if(e)e.value=(r[k]??'')})}
async function delRecord(id){if(confirm('削除しますか？')){await api('/api/records/'+id,{method:'DELETE'});loadRecords()}}
async function saveSettings(){let b={}; ['report_title','construction_name','contractor','span_name','pipe_diameter','drive_distance','writer','lubricant_material_name'].forEach(k=>b[k]=q(k).value); let f=q('logoFile').files[0]; if(f){b.logo_data=await new Promise(res=>{let rd=new FileReader(); rd.onload=()=>res(rd.result); rd.readAsDataURL(f)})} else b.logo_data=settings.logo_data||''; await api('/api/projects/'+pid()+'/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}); await loadAll(); alert('保存しました')}
function buildItemsBox(){let h='<table><tr><th>順</th><th>項目名</th><th>単位</th><th>入力表示</th><th>印刷表示</th></tr>'; items.forEach(it=>h+=`<tr><td><input data-id="${it.id}" data-k="sort_order" value="${it.sort_order}"></td><td><input data-id="${it.id}" data-k="label" value="${it.label}"></td><td><input data-id="${it.id}" data-k="unit" value="${it.unit||''}"></td><td><input type="checkbox" data-id="${it.id}" data-k="visible" ${it.visible?'checked':''}></td><td><input type="checkbox" data-id="${it.id}" data-k="print_visible" ${it.print_visible?'checked':''}></td></tr>`); q('itemsBox').innerHTML=h+'</table>'}
async function saveItems(){let map={}; document.querySelectorAll('#itemsBox input').forEach(e=>{let id=e.dataset.id; map[id]=map[id]||{id}; map[id][e.dataset.k]=e.type==='checkbox'?e.checked:e.value}); await api('/api/projects/'+pid()+'/items',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:Object.values(map)})}); await loadAll(); alert('保存しました')}

async function saveLub(){let b={project_id:pid(),date:q('l_date').value||todayDT(),injection_pipe_no:q('l_pipe').value,injection_liter:q('l_liter').value,material_kg:q('l_mat').value,delivery_kg:q('l_del').value,remarks:q('l_remarks').value}; await api('/api/lubricants',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}); ['l_pipe','l_liter','l_mat','l_del','l_remarks'].forEach(id=>q(id).value=''); q('l_date').value=todayDT(); await loadLub()}
async function loadLub(){q('l_date').value=q('l_date').value||todayDT(); lubs=await api('/api/lubricants?project_id='+pid()); let mat=settings.lubricant_material_name||'材料'; let hs=['操作','日時','注入管No.','注入量ℓ','日注入累計ℓ','全体注入累計ℓ',mat+'kg','日材料累計kg','累計使用kg','搬入量kg','総搬入量kg','残数量kg','備考']; let h='<tr>'+hs.map(x=>'<th>'+x+'</th>').join('')+'</tr>'; lubs.forEach(r=>h+=`<tr><td><button class="danger" onclick="delLub(${r.id})">削除</button></td><td>${fmtDT(r.date)}</td><td>${r.injection_pipe_no||''}</td><td>${r.injection_liter??''}</td><td>${r.day_injection_total??''}</td><td>${r.total_injection??''}</td><td>${r.material_kg??''}</td><td>${r.day_material_total??''}</td><td>${r.total_material??''}</td><td>${r.delivery_kg??''}</td><td>${r.total_delivery??''}</td><td>${r.remaining??''}</td><td>${r.remarks||''}</td></tr>`); q('lubTable').innerHTML=h}
async function delLub(id){if(confirm('削除しますか？')){await api('/api/lubricants/'+id,{method:'DELETE'});loadLub()}}

function printRecords(mode){let arr=[...records]; if(mode==='day'){let d=prompt('印刷する日付（例 2026/06/02）'); if(!d)return; d=d.replaceAll('/','-'); arr=arr.filter(r=>(r.date||'').slice(0,10)===d)} if(mode==='range'){let a=Number(prompt('開始 推進管No.')); let b=Number(prompt('終了 推進管No.')); arr=arr.filter(r=>Number(r.pipe_no)>=a&&Number(r.pipe_no)<=b)} let chunks=[]; for(let i=0;i<arr.length;i+=10)chunks.push(arr.slice(i,i+10)); let printable=items.filter(x=>x.print_visible).sort((a,b)=>a.sort_order-b.sort_order); let html=''; chunks.forEach(ch=>{html+=`<div class="page"><div class="print-title">${settings.report_title||'泥水式推進工データー表'}</div><div class="headgrid"><table class="box"><tr><th>工事名</th><td>${settings.construction_name||''}</td></tr><tr><th>施工者</th><td>${settings.contractor||''}</td></tr></table><table class="box"><tr><th>スパン名</th><th>管径</th><th>推進距離</th></tr><tr style="height:13mm"><td>${settings.span_name||''}</td><td>${settings.pipe_diameter||''}</td><td>${settings.drive_distance||''}</td></tr></table><table class="box"><tr><th>記入者</th></tr><tr style="height:13mm"><td>${settings.writer||''}</td></tr></table></div><table class="printtbl" style="margin-top:5mm"><tr><th style="width:32mm">項目</th>${ch.map(r=>'<th>'+ (r.pipe_no??'') +'</th>').join('')}</tr><tr><th>日付</th>${ch.map(r=>'<td>'+fmtDT(r.date)+'</td>').join('')}</tr>`; printable.forEach(it=>{if(it.field_key==='remarks'){html+=`<tr style="height:18mm"><th>${it.label}</th>${ch.map(r=>'<td>'+(r.remarks||'')+'</td>').join('')}</tr>`}else if(it.field_key==='precision_center'){html+=`<tr><th>${it.label} ${it.unit||''}</th>${ch.map(r=>'<td>'+((r.precision_center_direction||'')+(r.precision_center_value??''))+'</td>').join('')}</tr>`}else if(it.field_key==='precision_level'){html+=`<tr><th>${it.label} ${it.unit||''}</th>${ch.map(r=>'<td>'+((r.precision_level_direction||'')+(r.precision_level_value??''))+'</td>').join('')}</tr>`}else{html+=`<tr><th>${it.label} ${it.unit||''}</th>${ch.map(r=>'<td>'+(r[it.field_key]??'')+'</td>').join('')}</tr>`}}); html+=`</table>${settings.logo_data?'<img class="logo" src="'+settings.logo_data+'">':''}</div>`}); q('printArea').innerHTML=html||'<div class="page">データがありません</div>'; window.print()}
function printLub(){let mat=settings.lubricant_material_name||'材料'; let h=`<div class="page lubPage"><div class="print-title">滑材注入管理表</div><table class="box"><tr><th>工事名</th><td>${settings.construction_name||''}</td><th>施工者</th><td>${settings.contractor||''}</td><th>材料名</th><td>${mat}</td></tr></table><table class="printtbl" style="margin-top:5mm"><tr>${['日時','注入管No.','注入量ℓ','日注入累計ℓ','全体注入累計ℓ',mat+'kg','日材料累計kg','累計使用kg','搬入量kg','総搬入量kg','残数量kg','備考'].map(x=>'<th>'+x+'</th>').join('')}</tr>`; lubs.forEach(r=>h+=`<tr><td>${fmtDT(r.date)}</td><td>${r.injection_pipe_no||''}</td><td>${r.injection_liter??''}</td><td>${r.day_injection_total??''}</td><td>${r.total_injection??''}</td><td>${r.material_kg??''}</td><td>${r.day_material_total??''}</td><td>${r.total_material??''}</td><td>${r.delivery_kg??''}</td><td>${r.total_delivery??''}</td><td>${r.remaining??''}</td><td>${r.remarks||''}</td></tr>`); q('printArea').innerHTML=h+'</table></div>'; window.print()}
loadProjects().catch(e=>alert(e.message));
</script></body></html>
