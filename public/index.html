<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>掘進管理システム</title>
<style>
body{font-family:system-ui,"Yu Gothic",sans-serif;margin:0;background:#f5f6f8;color:#111}.wrap{max-width:1200px;margin:auto;padding:14px}h1{font-size:22px}.card{background:white;border:1px solid #ddd;border-radius:10px;padding:14px;margin:12px 0}input,select,button,textarea{font-size:16px;padding:8px;margin:3px;box-sizing:border-box}button{cursor:pointer;border:1px solid #777;border-radius:7px;background:#fff}.primary{background:#0b63ce;color:white}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid label{display:flex;flex-direction:column;font-weight:600;font-size:13px}.grid input,.grid select{width:100%}table{border-collapse:collapse;width:100%;background:white}th,td{border:1px solid #ccc;padding:6px;text-align:center}th{background:#eee}.scroll{overflow:auto}.tabs button{margin-right:8px}.hide{display:none}.printArea{display:none}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}input,select,button,textarea{font-size:18px;padding:12px}.wrap{padding:8px}table{font-size:13px}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.tabs button{width:100%;margin:4px 0}}
@media print{body>*:not(.printArea){display:none!important}.printArea{display:block!important} @page{size:A4 landscape;margin:4mm}.page{page-break-after:always;width:287mm;height:200mm;box-sizing:border-box;padding:2mm;font-family:"Yu Mincho","MS Mincho",serif;position:relative}.ptitle{text-align:center;font-size:20px;margin:2mm}.top{display:grid;grid-template-columns:1.2fr 1fr .35fr;gap:10mm;align-items:end}.line{border-bottom:2px solid #000;min-height:7mm}.meta{display:grid;grid-template-columns:1fr 1fr 1.4fr;border:2px solid #000}.meta div{border:1px solid #000;text-align:center;min-height:11mm;padding:1mm}.meta .head{background:#bbb;min-height:5mm}.writer{border:2px solid #000;text-align:center}.ptable{width:100%;height:145mm;margin-top:5mm;table-layout:fixed}.ptable th,.ptable td{border:1.6px solid #000;padding:1px;font-size:10px;line-height:1.05}.ptable .item{width:32mm;text-align:left;font-size:11px}.ptable th{font-size:12px}.remarks td{height:25mm}.logo{position:absolute;right:8mm;bottom:2mm;max-width:30mm;max-height:15mm}
.lubPage{page-break-after:always;width:200mm;min-height:287mm;box-sizing:border-box;padding:5mm;font-family:"Yu Gothic",sans-serif}
.lubTitle{text-align:center;font-size:20px;margin-bottom:5mm}.lubInfo{display:flex;gap:10mm;margin-bottom:4mm}
.lubPrintTable{width:100%;border-collapse:collapse;font-size:9px}.lubPrintTable th,.lubPrintTable td{border:1px solid #000;padding:2px;text-align:center}.lubPrintTable th{background:#eee}}
</style></head><body><div class="wrap"><h1>掘進管理システム</h1>
<div class="card"><select id="project"></select><input id="newProject" placeholder="新しい現場名"><button onclick="addProject()">現場を追加</button></div>
<div class="tabs"><button onclick="show('input')">入力</button><button onclick="show('settings')">様式設定</button><button onclick="show('fields')">項目・単位設定</button><button onclick="show('lubricant')">滑材注入管理</button><button onclick="printAll()">一括印刷</button><button onclick="printDaily()">日報印刷</button><button onclick="printRange()">管No範囲印刷</button><button onclick="excel()">Excel出力</button><button onclick="backup()">現場バックアップ</button></div>
<section id="input" class="card"><h2>データ入力</h2><input type="hidden" id="id"><div id="form" class="grid"></div><button class="primary" onclick="saveRecord()">保存</button><button onclick="clearForm()">新規</button></section>
<section id="settings" class="card hide"><h2>印刷様式記入欄</h2><div class="grid">
<label>帳票タイトル<input id="report_title"></label><label>工事名<input id="construction_name"></label><label>施工者<input id="contractor"></label><label>スパン名<input id="span_name"></label><label>管径<input id="pipe_diameter"></label><label>推進距離<input id="push_distance"></label><label>記入者<input id="writer"></label><label>右下ロゴ<input type="file" id="logoFile" accept="image/*"></label></div><button class="primary" onclick="saveSettings()">様式設定を保存</button></section>
<section id="fields" class="card hide"><h2>項目名・単位・並び順</h2><div class="scroll"><table><thead><tr><th>順</th><th>項目名</th><th>単位</th><th>入力表示</th><th>印刷表示</th></tr></thead><tbody id="fieldRows"></tbody></table></div><button class="primary" onclick="saveFields()">項目設定を保存</button></section>

<section id="lubricant" class="card hide"><h2>滑材注入管理</h2>
  <div class="grid">
    <label>帳票タイトル<input id="lub_report_title" value="滑材注入管理表"></label>
    <label>材料名<input id="lub_material_name" placeholder="例：ベントナイト、滑材A"></label>
  </div>
  <button class="primary" onclick="saveLubSettings()">滑材設定を保存</button>
  <hr>
  <h3>入力</h3><input type="hidden" id="lub_id">
  <div class="grid">
    <label>日時<input type="datetime-local" id="lub_date"></label>
    <label>注入管No.<input id="lub_pipe_no"></label>
    <label>注入量 ℓ<input type="number" step="0.01" id="lub_liter"></label>
    <label><span id="lub_mat_label">材料</span> kg<input type="number" step="0.01" id="lub_material_kg"></label>
    <label>搬入量 kg<input type="number" step="0.01" id="lub_carry_kg"></label>
    <label>備考<input id="lub_remarks"></label>
  </div>
  <button class="primary" onclick="saveLubRecord()">滑材データ保存</button><button onclick="clearLubForm()">新規</button>
  <button onclick="printLubricant()">滑材表印刷</button><button onclick="lubExcel()">滑材Excel出力</button>
  <div class="scroll"><table><thead><tr><th>日時</th><th>注入管No.</th><th>注入量ℓ</th><th>日注入累計ℓ</th><th>全体注入累計ℓ</th><th>材料kg</th><th>日材料累計kg</th><th>材料累計kg</th><th>搬入量kg</th><th>総搬入量kg</th><th>残数量kg</th><th>備考</th><th>操作</th></tr></thead><tbody id="lubRows"></tbody></table></div>
</section>

<div class="card scroll"><h2>一覧</h2><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></div><div id="printArea" class="printArea"></div>
<script>
let projects=[],pid,records=[],settings={},fields=[],logo='';
const baseFields=['pipe_no','date','kafuatsu','sousui','hainyu_flow','kusshin_speed','motooshi_force','cutter_torque','souden_p1','haiden_p2','haiden_p3','haiden_p4','pitching','rolling','viscosity','specific_gravity','zando','precision_center','precision_level','remarks'];
const $=id=>document.getElementById(id); const api=(u,o)=>fetch(u,o).then(r=>r.json());
function show(id){['input','settings','fields'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
async function init(){projects=await api('/api/projects'); $('project').innerHTML=projects.map(p=>`<option value="${p.id}">${p.name}</option>`).join(''); pid=$('project').value; $('project').onchange=()=>{pid=$('project').value;loadAll()}; await loadAll()}
async function addProject(){let name=$('newProject').value.trim(); if(!name)return alert('現場名を入力'); let p=await api('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})}); $('newProject').value=''; await init(); $('project').value=p.id; pid=p.id; await loadAll()}
async function loadAll(){settings=await api('/api/settings/'+pid); logo=settings.logo_data||''; fields=await api('/api/fields/'+pid); records=await api('/api/records/'+pid); fillSettings(); renderForm(); renderFields(); renderTable(); clearForm(false)}
function field(k){return fields.find(f=>f.field_key===k)||{label:k,unit:'',visible:1,print_visible:1}}
function label(k){let f=field(k);return f.label+(f.unit?'（'+f.unit+'）':'')}
function fillSettings(){['report_title','construction_name','contractor','span_name','pipe_diameter','push_distance','writer'].forEach(k=>$(k).value=settings[k]||''); if(!$('report_title').value)$('report_title').value='泥水式推進工データー表'}
function renderForm(){let html=''; fields.filter(f=>f.visible).forEach(f=>{let k=f.field_key;if(k==='date')html+=`<label>${label(k)}<input id="${k}" type="datetime-local"></label>`;else if(k==='remarks')html+=`<label>${label(k)}<textarea id="${k}"></textarea></label>`;else if(k==='precision_center'||k==='precision_level'){html+=`<label>${label(k)}<div><select id="${k}_direction"><option></option><option>右</option><option>左</option><option>上</option><option>下</option></select><input id="${k}_value" type="number" step="0.01"></div></label>`}else html+=`<label>${label(k)}<input id="${k}" type="${k==='pipe_no'?'number':'number'}" step="0.01"></label>`});$('form').innerHTML=html}
function renderFields(){ $('fieldRows').innerHTML=fields.map(f=>`<tr data-key="${f.field_key}"><td><input value="${f.sort_order}" type="number" style="width:60px"></td><td><input value="${f.label}"></td><td><input value="${f.unit||''}"></td><td><input type="checkbox" ${f.visible?'checked':''}></td><td><input type="checkbox" ${f.print_visible?'checked':''}></td></tr>`).join('')}
async function saveFields(){let arr=[...document.querySelectorAll('#fieldRows tr')].map(tr=>{let i=tr.querySelectorAll('input');return{field_key:tr.dataset.key,sort_order:i[0].value,label:i[1].value,unit:i[2].value,visible:i[3].checked,print_visible:i[4].checked}}); await api('/api/fields/'+pid,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:arr})}); await loadAll(); alert('保存しました')}
async function saveSettings(){let data={}; ['report_title','construction_name','contractor','span_name','pipe_diameter','push_distance','writer'].forEach(k=>data[k]=$(k).value); data.logo_data=logo; await api('/api/settings/'+pid,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}); await loadAll(); alert('保存しました')}
$('logoFile').onchange=e=>{let f=e.target.files[0]; if(!f)return; let r=new FileReader(); r.onload=()=>logo=r.result; r.readAsDataURL(f)}
async function clearForm(getNext=true){$('id').value=''; if($('date'))$('date').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16); if(getNext&&$('pipe_no')){let n=await api('/api/records/'+pid+'/next-pipe-no');$('pipe_no').value=n.next} ['remarks'].forEach(k=>$(k)&&($(k).value=''))}
function collect(){let d={}; baseFields.forEach(k=>{if(k==='precision_center'||k==='precision_level'){d[k+'_direction']=$(k+'_direction')?.value||''; d[k+'_value']=$(k+'_value')?.value||''}else d[k]=$(k)?.value??''}); return d}
async function saveRecord(){let id=$('id').value, opt={method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(collect())}; await api('/api/records/'+pid+(id?'/'+id:''),opt); await loadAll()}
function edit(r){$('id').value=r.id; baseFields.forEach(k=>{if(k==='precision_center'||k==='precision_level'){let d=$(k+'_direction'),v=$(k+'_value'); if(d)d.value=r[k+'_direction']||''; if(v)v.value=r[k+'_value']??''}else if($(k))$(k).value=(r[k]??'')}) ; scrollTo(0,0)}
async function del(id){if(confirm('削除しますか')){await api('/api/records/'+pid+'/'+id,{method:'DELETE'});loadAll()}}
function val(r,k){if(k==='precision_center'||k==='precision_level')return (r[k+'_direction']||'')+(r[k+'_value']??''); if(k==='date')return fmt(r.date); return r[k]??''}
function fmt(d){if(!d)return''; return String(d).replace('T',' ').slice(0,16).replaceAll('-','/')}
function renderTable(){let fs=fields.filter(f=>f.visible); $('thead').innerHTML='<tr>'+fs.map(f=>`<th>${label(f.field_key)}</th>`).join('')+'<th>操作</th></tr>'; $('tbody').innerHTML=records.map(r=>'<tr>'+fs.map(f=>`<td>${val(r,f.field_key)}</td>`).join('')+`<td><button onclick='edit(${JSON.stringify(r)})'>編集</button><button onclick='del(${r.id})'>削除</button></td></tr>`).join('')}
function filtered(mode){if(mode==='daily'){let d=prompt('印刷する日付を入力（例 2026/06/02）'); if(!d)return[]; d=d.replaceAll('-','/'); return records.filter(r=>fmt(r.date).startsWith(d))} if(mode==='range'){let a=Number(prompt('開始 推進管No.')),b=Number(prompt('終了 推進管No.')); return records.filter(r=>Number(r.pipe_no)>=a&&Number(r.pipe_no)<=b)} return records}
function printAll(){makePrint(records)} function printDaily(){makePrint(filtered('daily'))} function printRange(){makePrint(filtered('range'))}
function makePrint(rows){let fs=fields.filter(f=>f.print_visible); let chunks=[]; for(let i=0;i<rows.length;i+=10)chunks.push(rows.slice(i,i+10)); if(!chunks.length)return alert('印刷データなし'); $('printArea').innerHTML=chunks.map(chunk=>page(chunk,fs)).join(''); setTimeout(()=>print(),100)}
function page(rows,fs){return `<div class="page"><div class="ptitle">${settings.report_title||'泥水式推進工データー表'}</div><div class="top"><div><div>工事名 <span class="line">${settings.construction_name||''}</span></div><div>施工者 <span class="line">${settings.contractor||''}</span></div></div><div class="meta"><div class="head">スパン名</div><div class="head">管径</div><div class="head">推進距離</div><div>${settings.span_name||''}</div><div>${settings.pipe_diameter||''}</div><div>${settings.push_distance||''}</div></div><div class="writer"><div style="background:#bbb">記入者</div><div>${settings.writer||''}</div></div></div><table class="ptable"><tr><th class="item">項目</th>${rows.map(r=>`<th>${r.pipe_no||''}</th>`).join('')}${'<th></th>'.repeat(10-rows.length)}</tr>${fs.filter(f=>f.field_key!=='pipe_no').map(f=>`<tr class="${f.field_key==='remarks'?'remarks':''}"><td class="item">${f.label}${f.unit?'　'+f.unit:''}</td>${rows.map(r=>`<td>${val(r,f.field_key)}</td>`).join('')}${'<td></td>'.repeat(10-rows.length)}</tr>`).join('')}</table>${logo?`<img class="logo" src="${logo}">`:''}</div>`}
function excel(){location.href='/api/export/excel/'+pid} function backup(){location.href='/api/backup/'+pid}

// ---- 滑材注入管理 ----
let lubSettings={}, lubRecords=[];
function sumFmt(v){return (v==null||v==='')?'':Number(v).toFixed(2).replace(/\.00$/,'')}
async function loadLubricant(){
  if(!pid)return;
  lubSettings=await api('/api/lubricant/settings/'+pid);
  lubRecords=await api('/api/lubricant/records/'+pid);
  $('lub_report_title').value=lubSettings.report_title||'滑材注入管理表';
  $('lub_material_name').value=lubSettings.material_name||'滑材';
  $('lub_mat_label').textContent=lubSettings.material_name||'材料';
  renderLubRows(); clearLubForm(false);
}
async function saveLubSettings(){
  await api('/api/lubricant/settings/'+pid,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({report_title:$('lub_report_title').value,material_name:$('lub_material_name').value})});
  await loadLubricant(); alert('滑材設定を保存しました');
}
function clearLubForm(setDate=true){$('lub_id').value=''; if(setDate!==false)$('lub_date').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16); ['lub_pipe_no','lub_liter','lub_material_kg','lub_carry_kg','lub_remarks'].forEach(id=>$(id).value='')}
function collectLub(){return {date:$('lub_date').value,injection_pipe_no:$('lub_pipe_no').value,injection_liter:$('lub_liter').value,material_kg:$('lub_material_kg').value,carry_in_kg:$('lub_carry_kg').value,remarks:$('lub_remarks').value}}
async function saveLubRecord(){let id=$('lub_id').value; await api('/api/lubricant/records/'+pid+(id?'/'+id:''),{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(collectLub())}); await loadLubricant();}
function editLub(r){$('lub_id').value=r.id;$('lub_date').value=(r.date||'').slice(0,16);$('lub_pipe_no').value=r.injection_pipe_no||'';$('lub_liter').value=r.injection_liter??'';$('lub_material_kg').value=r.material_kg??'';$('lub_carry_kg').value=r.carry_in_kg??'';$('lub_remarks').value=r.remarks||'';scrollTo(0,0)}
async function delLub(id){if(confirm('削除しますか')){await api('/api/lubricant/records/'+pid+'/'+id,{method:'DELETE'});await loadLubricant()}}
function renderLubRows(){if(!$('lubRows'))return; $('lubRows').innerHTML=lubRecords.map(r=>`<tr><td>${fmt(r.date)}</td><td>${r.injection_pipe_no||''}</td><td>${sumFmt(r.injection_liter)}</td><td>${sumFmt(r.day_injection_cum)}</td><td>${sumFmt(r.total_injection_cum)}</td><td>${sumFmt(r.material_kg)}</td><td>${sumFmt(r.day_material_cum)}</td><td>${sumFmt(r.total_material_cum)}</td><td>${sumFmt(r.carry_in_kg)}</td><td>${sumFmt(r.total_carry_in_cum)}</td><td>${sumFmt(r.remaining_kg)}</td><td>${r.remarks||''}</td><td><button onclick='editLub(${JSON.stringify(r)})'>編集</button><button onclick='delLub(${r.id})'>削除</button></td></tr>`).join('')}
function printLubricant(){ if(!lubRecords.length)return alert('滑材データなし'); let chunks=[]; for(let i=0;i<lubRecords.length;i+=28)chunks.push(lubRecords.slice(i,i+28)); $('printArea').innerHTML=chunks.map(ch=>`<div class="lubPage"><div class="lubTitle">${lubSettings.report_title||'滑材注入管理表'}</div><div class="lubInfo"><div>現場：${$('project').selectedOptions[0]?.textContent||''}</div><div>材料名：${lubSettings.material_name||''}</div></div><table class="lubPrintTable"><tr><th>日時</th><th>注入管No.</th><th>注入量ℓ</th><th>日注入累計ℓ</th><th>全体注入累計ℓ</th><th>${lubSettings.material_name||'材料'}kg</th><th>日材料累計kg</th><th>材料累計kg</th><th>搬入量kg</th><th>総搬入量kg</th><th>残数量kg</th><th>備考</th></tr>${ch.map(r=>`<tr><td>${fmt(r.date)}</td><td>${r.injection_pipe_no||''}</td><td>${sumFmt(r.injection_liter)}</td><td>${sumFmt(r.day_injection_cum)}</td><td>${sumFmt(r.total_injection_cum)}</td><td>${sumFmt(r.material_kg)}</td><td>${sumFmt(r.day_material_cum)}</td><td>${sumFmt(r.total_material_cum)}</td><td>${sumFmt(r.carry_in_kg)}</td><td>${sumFmt(r.total_carry_in_cum)}</td><td>${sumFmt(r.remaining_kg)}</td><td>${r.remarks||''}</td></tr>`).join('')}</table></div>`).join(''); setTimeout(()=>print(),100)}
function lubExcel(){location.href='/api/lubricant/export/excel/'+pid}

const _oldLoadAll=loadAll; loadAll=async function(){ await _oldLoadAll(); await loadLubricant(); };
init();
</script></body></html>
