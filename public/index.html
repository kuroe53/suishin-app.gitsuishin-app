<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>掘進管理システム</title>
<style>
body{font-family:"Yu Gothic","Meiryo",sans-serif;margin:16px;background:#f6f7f8;color:#111}
h1{font-size:22px;margin:0 0 12px}.card{background:#fff;border:1px solid #ccc;border-radius:8px;padding:12px;margin-bottom:12px}
label{display:block;font-size:12px;margin-bottom:3px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
input,select,textarea,button{font:inherit;box-sizing:border-box}input,select,textarea{width:100%;padding:6px;border:1px solid #aaa;border-radius:4px}
button{padding:7px 12px;border:1px solid #333;background:#fff;border-radius:4px;cursor:pointer}button.primary{background:#1f6feb;color:#fff;border-color:#1f6feb}
table{border-collapse:collapse;width:100%;background:#fff}th,td{border:1px solid #ccc;padding:4px;font-size:12px;text-align:center}th{background:#e9ecef}
.small{font-size:12px;color:#555}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none}
@media print{
 body{margin:0;background:#fff}.no-print{display:none!important}.print-area{display:block!important}
 @page{size:A4 landscape;margin:7mm}
 .print-page{page-break-after:always;width:283mm;height:196mm;box-sizing:border-box;background:#fff;position:relative;padding:5mm 6mm 4mm 6mm;overflow:hidden}
}
.print-area{display:none}
.print-title{text-align:center;font-family:serif;font-size:18pt;margin:0 0 7mm}
.print-head{display:grid;grid-template-columns:42% 38% 13%;gap:7mm;align-items:start;margin-bottom:6mm}
.line-field{font-family:serif;font-size:11pt;border-bottom:2px solid #000;min-height:7mm;padding:1mm 2mm;white-space:nowrap;overflow:hidden}
.line-field b{font-size:10pt;margin-right:8mm}
.info-table{width:100%;font-family:serif}.info-table td,.info-table th{border:2px solid #000;padding:2mm;font-size:12pt}.info-table th{background:#c9c9c9;font-weight:normal}.red{color:red;font-weight:bold}
.print-table{width:100%;table-layout:fixed;font-family:serif;border:3px solid #000}
.print-table td,.print-table th{border:1.8px solid #000;padding:0.7mm 1mm;height:7mm;font-size:10pt;overflow:hidden}
.print-table .no{width:12mm;text-align:center}.print-table .item{width:54mm;text-align:left;font-size:10.5pt;letter-spacing:.12em}.print-table .val{text-align:center}
.note-row td{height:21mm}.logo{position:absolute;right:12mm;bottom:4mm;max-width:34mm;max-height:16mm}
</style>
</head>
<body>
<div class="no-print">
<h1>掘進管理システム</h1>
<div class="card">
  <div class="actions">
    <select id="projectSelect" style="max-width:260px"></select>
    <input id="newProjectName" placeholder="追加する現場名" style="max-width:260px">
    <button onclick="addProject()">現場を追加</button>
    <button onclick="renameProject()">現場名変更</button>
    <button class="primary" onclick="preparePrint();window.print()">一括印刷</button>
  </div>
  <p class="small">現場を追加できない不具合対策として、API・画面処理を作り直しています。</p>
</div>

<div class="card">
<h2>印刷様式記入欄</h2>
<div class="grid">
  <div><label>工事名</label><input id="construction_name"></div>
  <div><label>施工者</label><input id="contractor"></div>
  <div><label>スパン名</label><input id="span_name"></div>
  <div><label>管径</label><input id="pipe_diameter"></div>
  <div><label>推進距離</label><input id="jacking_distance"></div>
  <div><label>記入者</label><input id="writer"></div>
  <div><label>右下ロゴ画像</label><input type="file" id="logoFile" accept="image/*"></div>
  <div><label>&nbsp;</label><button class="primary" onclick="saveSettings()">様式設定を保存</button></div>
</div>
<input type="hidden" id="logo_data">
</div>

<div class="card">
<h2 id="formTitle">新規入力</h2>
<input type="hidden" id="recordId">
<div class="grid">
 <div><label>推進管No.</label><input id="pipe_no" type="number" step="1"></div>
 <div><label>日時</label><input id="date" type="datetime-local"></div>
 <div><label>切羽土圧（Mpa）</label><input id="face_earth_pressure" type="number" step="any"></div>
 <div><label>送水圧（kg/cm2）</label><input id="sousui" type="number" step="any"></div>
 <div><label>排泥流量（m3/分）</label><input id="hainyu_flow" type="number" step="any"></div>
 <div><label>掘進速度（cm/分）</label><input id="kusshin_speed" type="number" step="any"></div>
 <div><label>元押し推力（kN）</label><input id="motooshi_force" type="number" step="any"></div>
 <div><label>カッタートルク（A）</label><input id="cutter_torque" type="number" step="any"></div>
 <div><label>送泥P1ポンプ（rpm）</label><input id="souden_p1" type="number" step="any"></div>
 <div><label>排泥P2ポンプ（rpm）</label><input id="haiden_p2" type="number" step="any"></div>
 <div><label>排泥P3ポンプ</label><input id="haiden_p3" type="number" step="any"></div>
 <div><label>排泥P4ポンプ</label><input id="haiden_p4" type="number" step="any"></div>
 <div><label>ピッチング</label><input id="pitching" type="number" step="any"></div>
 <div><label>ローリング</label><input id="rolling" type="number" step="any"></div>
 <div><label>粘性（秒）</label><input id="viscosity" type="number" step="any"></div>
 <div><label>比重</label><input id="specific_gravity" type="number" step="any"></div>
 <div><label>残土量（m3）</label><input id="zando" type="number" step="any"></div>
 <div><label>推進精度 センター方向</label><select id="precision_center_direction"><option></option><option>右</option><option>左</option></select></div>
 <div><label>推進精度 センター値（mm）</label><input id="precision_center_value" type="number" step="any"></div>
 <div><label>推進精度 レベル方向</label><select id="precision_level_direction"><option></option><option>上</option><option>下</option></select></div>
 <div><label>推進精度 レベル値（mm）</label><input id="precision_level_value" type="number" step="any"></div>
 <div style="grid-column:span 4"><label>特記事項</label><textarea id="remarks"></textarea></div>
</div>
<div class="actions" style="margin-top:10px">
 <button class="primary" onclick="saveRecord()">保存</button>
 <button onclick="clearForm()">新規入力に戻す</button>
</div>
</div>

<div class="card">
<h2>入力済みデータ</h2>
<table id="listTable"></table>
</div>
</div>

<div id="printArea" class="print-area"></div>

<script>
let currentProjectId=1, records=[], settings={};
const recordFields=['pipe_no','date','face_earth_pressure','sousui','hainyu_flow','kusshin_speed','motooshi_force','cutter_torque','souden_p1','haiden_p2','haiden_p3','haiden_p4','pitching','rolling','viscosity','specific_gravity','zando','precision_center_direction','precision_center_value','precision_level_direction','precision_level_value','remarks'];
const settingFields=['construction_name','contractor','span_name','pipe_diameter','jacking_distance','writer','logo_data'];
const esc=s=>(s??'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const val=(r,k)=>esc(r?.[k]??'');
async function api(url,opt){const r=await fetch(url,opt); const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||'通信エラー'); return j;}
function nowLocal(){const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16);}
async function loadProjects(){
 const ps=await api('/api/projects'); const sel=document.getElementById('projectSelect'); sel.innerHTML='';
 ps.forEach(p=>sel.add(new Option(p.name,p.id))); if(ps.length){currentProjectId=Number(sel.value||ps[0].id);}
 sel.onchange=()=>{currentProjectId=Number(sel.value); loadAll();};
}
async function addProject(){
 const name=document.getElementById('newProjectName').value.trim(); if(!name) return alert('現場名を入力してください');
 const p=await api('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
 document.getElementById('newProjectName').value=''; await loadProjects(); document.getElementById('projectSelect').value=p.id; currentProjectId=p.id; await loadAll();
}
async function renameProject(){
 const sel=document.getElementById('projectSelect'); const name=prompt('新しい現場名', sel.options[sel.selectedIndex]?.text||''); if(!name) return;
 await api('/api/projects/'+currentProjectId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})}); await loadProjects(); document.getElementById('projectSelect').value=currentProjectId;
}
async function loadSettings(){
 settings=await api('/api/settings/'+currentProjectId);
 settingFields.forEach(f=>{ if(document.getElementById(f)) document.getElementById(f).value=settings[f]||''; });
}
async function saveSettings(){
 const b={}; settingFields.forEach(f=>b[f]=document.getElementById(f).value||'');
 settings=await api('/api/settings/'+currentProjectId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
 await loadSettings(); alert('様式設定を保存しました');
}
document.getElementById('logoFile').addEventListener('change',e=>{
 const file=e.target.files[0]; if(!file) return;
 const rd=new FileReader(); rd.onload=()=>document.getElementById('logo_data').value=rd.result; rd.readAsDataURL(file);
});
async function setNextPipeNo(){ const j=await api('/api/next-pipe-no?project_id='+currentProjectId); document.getElementById('pipe_no').value=j.next; }
function collectRecord(){
 const b={project_id:currentProjectId};
 recordFields.forEach(f=>b[f]=document.getElementById(f).value);
 return b;
}
async function saveRecord(){
 const id=document.getElementById('recordId').value; const body=collectRecord();
 if(!body.date) return alert('日時を入力してください');
 if(id) await api('/api/records/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 else await api('/api/records',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 await clearForm(); await loadRecords();
}
async function clearForm(){
 document.getElementById('recordId').value=''; document.getElementById('formTitle').textContent='新規入力';
 recordFields.forEach(f=>{const el=document.getElementById(f); if(el) el.value='';});
 document.getElementById('date').value=nowLocal(); await setNextPipeNo();
}
function editRecord(id){
 const r=records.find(x=>x.id==id); if(!r) return;
 document.getElementById('recordId').value=r.id; document.getElementById('formTitle').textContent='編集';
 recordFields.forEach(f=>{const el=document.getElementById(f); if(el) el.value=(r[f]??'');});
 window.scrollTo(0,0);
}
async function deleteRecord(id){ if(confirm('削除しますか？')){ await api('/api/records/'+id,{method:'DELETE'}); await loadRecords(); await clearForm(); } }
async function loadRecords(){
 records=await api('/api/records?project_id='+currentProjectId);
 const t=document.getElementById('listTable');
 t.innerHTML='<tr><th>操作</th><th>推進管No.</th><th>日時</th><th>切羽土圧</th><th>送水圧</th><th>元押し推力(kN)</th><th>特記事項</th></tr>'+
 records.map(r=>`<tr><td><button onclick="editRecord(${r.id})">編集</button> <button onclick="deleteRecord(${r.id})">削除</button></td><td>${val(r,'pipe_no')}</td><td>${val(r,'date')}</td><td>${val(r,'face_earth_pressure')}</td><td>${val(r,'sousui')}</td><td>${val(r,'motooshi_force')}</td><td>${val(r,'remarks')}</td></tr>`).join('');
}
async function loadAll(){ await loadSettings(); await loadRecords(); await clearForm(); }
function cell(r,k){ return `<td class="val">${val(r,k)}</td>`; }
function row(no,label,unit,key,chunk){return `<tr><td class="no">${no}</td><td class="item">${label}${unit?`　${unit}`:''}</td>${chunk.map(r=>cell(r,key)).join('')}</tr>`}
function precision(r,type){ if(type==='c') return `${val(r,'precision_center_direction')} ${val(r,'precision_center_value')}`.trim(); return `${val(r,'precision_level_direction')} ${val(r,'precision_level_value')}`.trim(); }
function preparePrint(){
 const area=document.getElementById('printArea'); area.innerHTML='';
 const chunks=[]; for(let i=0;i<records.length;i+=10) chunks.push(records.slice(i,i+10)); if(!chunks.length) chunks.push([]);
 chunks.forEach(chunk=>{
  while(chunk.length<10) chunk.push({});
  const page=document.createElement('div'); page.className='print-page';
  page.innerHTML=`
   <div class="print-title">泥水式推進工データー表</div>
   <div class="print-head">
    <div>
     <div class="line-field"><b>工事名</b>${esc(settings.construction_name)}</div>
     <div class="line-field"><b>施工者</b>${esc(settings.contractor)}</div>
    </div>
    <table class="info-table"><tr><th>スパン名</th><th>管径</th><th>推進距離</th></tr>
     <tr><td class="red">${esc(settings.span_name)}</td><td>${esc(settings.pipe_diameter)}</td><td>${esc(settings.jacking_distance)}</td></tr></table>
    <table class="info-table"><tr><th>記入者</th></tr><tr><td>${esc(settings.writer)}</td></tr></table>
   </div>
   <table class="print-table">
    <tr><td class="no">1</td><td class="item">推　進　管　No</td>${chunk.map(r=>`<td class="val">${val(r,'pipe_no')}</td>`).join('')}</tr>
    <tr><td class="no">2</td><td class="item">日　付</td>${chunk.map(r=>`<td class="val">${esc((r.date||'').replace('T',' '))}</td>`).join('')}</tr>
    ${row(3,'切　羽　土　圧','Mpa','face_earth_pressure',chunk)}
    ${row(4,'送　水　圧','kg/cm2','sousui',chunk)}
    ${row(5,'排　泥　流　量','m3/分','hainyu_flow',chunk)}
    ${row(6,'掘　進　速　度','cm/分','kusshin_speed',chunk)}
    ${row(7,'元　押　推　力','kN','motooshi_force',chunk)}
    ${row(8,'カッタートルク','A','cutter_torque',chunk)}
    ${row(9,'送泥P1ポンプ','rpm','souden_p1',chunk)}
    ${row(10,'排泥P2ポンプ','rpm','haiden_p2',chunk)}
    ${row(11,'排泥P3ポンプ','','haiden_p3',chunk)}
    ${row(12,'排泥P4ポンプ','','haiden_p4',chunk)}
    ${row(13,'ピッチング','土','pitching',chunk)}
    ${row(14,'ローリング','土','rolling',chunk)}
    ${row(15,'粘　性','(秒)','viscosity',chunk)}
    ${row(16,'比　重','','specific_gravity',chunk)}
    ${row(17,'残　土　量','m3','zando',chunk)}
    <tr><td class="no">18</td><td class="item">推進精度 センター(mm)</td>${chunk.map(r=>`<td class="val">${esc(precision(r,'c'))}</td>`).join('')}</tr>
    <tr><td class="no">19</td><td class="item">レベル(mm)</td>${chunk.map(r=>`<td class="val">${esc(precision(r,'l'))}</td>`).join('')}</tr>
    <tr class="note-row"><td class="no">20</td><td class="item">特　記　事　項</td>${chunk.map(r=>`<td class="val">${val(r,'remarks')}</td>`).join('')}</tr>
   </table>
   ${settings.logo_data?`<img class="logo" src="${settings.logo_data}">`:''}`;
  area.appendChild(page);
 });
}
(async()=>{ await loadProjects(); await loadAll(); })().catch(e=>alert(e.message));
</script>
</body>
</html>
