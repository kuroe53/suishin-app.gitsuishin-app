<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>掘進管理システム</title>
<style>
body{font-family:system-ui,'Meiryo',sans-serif;margin:0;background:#f4f6f8;color:#222}.wrap{max-width:1280px;margin:auto;padding:12px}
h1{font-size:22px}.tabs button,.btn{border:0;background:#2563eb;color:white;padding:10px 14px;border-radius:8px;margin:3px;cursor:pointer}.tabs button.active{background:#111827}
.card{background:white;border-radius:12px;padding:14px;margin:10px 0;box-shadow:0 1px 4px #0002}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
label{font-size:13px;font-weight:600}input,select,textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid #bbb;border-radius:6px}table{border-collapse:collapse;width:100%;background:white}th,td{border:1px solid #999;padding:6px;font-size:13px;text-align:center}th{background:#e5e7eb;cursor:pointer}.scroll{overflow:auto}.hidden{display:none}.small{font-size:12px;color:#555}.colorrow{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px;align-items:center;margin:5px 0}
#graphSvg{width:100%;height:480px;background:white;border:1px solid #ccc}.legend{display:flex;gap:12px;flex-wrap:wrap}.legend span{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px}
.printOnly{display:none}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.tabs button,.btn{width:100%;margin:4px 0}th,td{font-size:12px;padding:4px}}
@media print{
body{background:white}.wrap{display:none!important}.noPrint{display:none!important}.printOnly{display:block!important}.card{box-shadow:none}
@page{size:A4 landscape;margin:5mm}
.page{page-break-after:always;position:relative;box-sizing:border-box;min-height:190mm;padding-bottom:20mm;overflow:hidden}
.page:last-child{page-break-after:auto}
.printLogo{position:absolute;right:6mm;bottom:2mm;max-width:34mm;max-height:16mm;object-fit:contain}
.drivePrintTable{table-layout:fixed;width:100%;border-collapse:collapse}
.drivePrintTable th,.drivePrintTable td{height:7mm;line-height:1.1;font-size:10.5px;padding:2px;overflow:hidden;word-break:break-word}
.drivePrintTable th:first-child,.drivePrintTable td:first-child{width:34mm;font-weight:600}
.driveRemarkRow td{height:32mm!important;vertical-align:top;text-align:left;white-space:pre-wrap;word-break:break-word;font-size:10px}
.driveRemarkRow td:first-child{text-align:center;vertical-align:middle;font-size:12px;font-weight:600}
.printMeta{width:100%;border-collapse:collapse;margin:2mm 0 3mm 0;table-layout:fixed}
.printMeta th{background:#cfcfcf;font-size:11px;border:1px solid #111;padding:2px;text-align:center}
.printMeta td{font-size:12px;border:1px solid #111;padding:3px;text-align:center;height:9mm}
.lubPrintLogo{position:absolute;right:6mm;bottom:2mm;max-width:34mm;max-height:16mm;object-fit:contain}
}
</style></head><body><div class="wrap">
<div class="noPrint"><h1>掘進管理システム</h1>
<div class="card"><label>現場</label><select id="projectSel" onchange="loadProject()"></select>
<input id="newProjectName" placeholder="追加する現場名"><button class="btn" onclick="addProject()">現場追加</button></div>
<div class="tabs">
<button onclick="tab('drive')" class="active">掘進管理</button><button onclick="tab('lub')">滑材注入管理</button><button onclick="tab('graph')">グラフ</button><button onclick="tab('settings')">設定</button>
</div></div>

<section id="drive" class="card"><h2>掘進データ入力</h2><div class="grid" id="recordForm"></div><button class="btn" onclick="saveRecord()">保存</button><button class="btn" onclick="printDrive()">掘進印刷</button><button class="btn" onclick="exportExcel()">Excel出力</button><button class="btn" onclick="backup()">現場バックアップ</button><h3>データ一覧</h3><div class="scroll"><table id="recordTable"></table></div></section>

<section id="lub" class="card hidden"><h2>滑材注入管理</h2>
<div class="grid"><div><label>材料名</label><input id="lubMaterial"></div><div style="align-self:end"><button class="btn" onclick="saveLubSettings()">材料名保存</button></div></div>
<div class="grid"><div><label>日付</label><input id="lubDate" type="date"></div><div><label>注入管No.</label><input id="lubPipe"></div><div><label>注入量 ℓ</label><input id="lubInj" type="number" step="any"></div><div><label>材料 kg</label><input id="lubMat" type="number" step="any"></div><div><label>搬入量 kg</label><input id="lubCarry" type="number" step="any"></div><div style="grid-column:span 2"><label>備考</label><input id="lubRemarks"></div></div>
<button class="btn" onclick="saveLub()">滑材データ保存</button><button class="btn" onclick="printLub()">滑材表印刷</button>
<div class="scroll"><table id="lubTable"></table></div></section>

<section id="graph" class="card hidden"><h2>グラフ</h2>
<div class="grid">
<div><label>保存済みグラフ設定</label><select id="graphConfigSel" onchange="loadGraphConfig()"></select></div>
<div><label>設定名</label><input id="graphName" placeholder="例：土圧・推力"></div>
<div><label>横軸</label><select id="xAxis"><option value="pipe_no">推進管No.</option><option value="datetime">日付</option></select></div>
<div><label>横軸表示名 任意</label><input id="xAxisLabel" placeholder="未入力なら自動"></div>
</div>
<div class="card"><b>表示する値・色</b><div id="graphFields"></div></div>
<button class="btn" onclick="drawGraph()">グラフ表示</button><button class="btn" onclick="saveGraphConfig()">この設定を保存</button><button class="btn" onclick="deleteGraphConfig()">設定削除</button><button class="btn" onclick="downloadSvg()">SVG保存</button>
<div id="legend" class="legend"></div><svg id="graphSvg" viewBox="0 0 1000 480"></svg><p class="small">複数項目を同時表示できます。設定保存後は、プルダウンから選ぶだけで再表示できます。</p></section>

<section id="settings" class="card hidden"><h2>様式・項目設定</h2>
<div class="grid"><div><label>帳票タイトル</label><input id="setTitle"></div><div><label>工事名</label><input id="setWork"></div><div><label>施工者</label><input id="setContractor"></div><div><label>スパン名</label><input id="setSpan"></div><div><label>管径</label><input id="setDia"></div><div><label>推進距離</label><input id="setDist"></div><div><label>記入者</label><input id="setWriter"></div><div><label>印刷1枚の表示データ数</label><input id="setPerPage" type="number" min="1" max="20" value="10"></div><div><label>右下ロゴ</label><input type="file" id="logoFile" accept="image/*"></div></div>
<button class="btn" onclick="saveSettings()">様式設定保存</button><h3>項目名・単位・順序</h3><div id="fieldSettings"></div><button class="btn" onclick="saveFields()">項目設定保存</button></section>
</div><div id="printArea" class="printOnly"></div>

<script>
let projectId=null,currentProject=null,records=[],fields=[],lub=null,editId=null,sortKey='pipe_no',sortAsc=false;
const $=id=>document.getElementById(id);
function today(){return new Date().toISOString().slice(0,10)}
function fmtDateTime(s){if(!s)return''; return String(s).replace('T',' ').slice(0,16)}
function fmtDate(s){return s?String(s).slice(0,10):''}
function n(v){return v==null||v===''?'':v}
async function api(url,opt){let r=await fetch(url,opt); if(!r.ok)throw new Error(await r.text()); return r.json()}
async function init(){await loadProjects()}
async function loadProjects(){let ps=await api('/api/projects'); $('projectSel').innerHTML=ps.map(p=>`<option value="${p.id}">${p.name}</option>`).join(''); projectId=ps[0]?.id; await loadProject()}
async function addProject(){let name=$('newProjectName').value.trim(); if(!name)return alert('現場名を入力してください'); let p=await api('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})}); await loadProjects(); $('projectSel').value=p.id; await loadProject()}
async function loadProject(){projectId=$('projectSel').value; currentProject=await api('/api/project/'+projectId); fields=(currentProject.fields||[]).sort((a,b)=>(a.order||0)-(b.order||0)); await Promise.all([loadRecords(),loadLub()]); renderForm(); renderSettings(); renderGraphFields(); renderGraphConfigList();}
function tab(id){document.querySelectorAll('section').forEach(s=>s.classList.add('hidden')); $(id).classList.remove('hidden'); document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active')); event.target.classList.add('active');}
async function loadRecords(){records=await api('/api/project/'+projectId+'/records'); renderTable()}
async function renderForm(){let next=await api('/api/project/'+projectId+'/next-pipe'); let html=`<div><label>推進管No.</label><input id="pipe_no" type="number" value="${next.next}"></div><div><label>日時</label><input id="datetime" type="datetime-local"></div>`; fields.filter(f=>f.show!==false).forEach(f=>html+=`<div><label>${f.label} ${f.unit?`(${f.unit})`:''}</label><input id="f_${f.key}" type="number" step="any"></div>`); html+=`<div style="grid-column:span 2"><label>特記事項</label><input id="remarks"></div>`; $('recordForm').innerHTML=html;}
async function saveRecord(){let body={pipe_no:$('pipe_no').value,datetime:$('datetime').value,remarks:$('remarks').value}; fields.forEach(f=>{let el=$('f_'+f.key); if(el)body[f.key]=el.value}); let url='/api/project/'+projectId+'/records'+(editId?'/'+editId:''); await api(url,{method:editId?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); editId=null; await loadRecords(); renderForm();}
function editRecord(id){let r=records.find(x=>x.id==id); editId=id; $('pipe_no').value=n(r.pipe_no); $('datetime').value=r.datetime||''; $('remarks').value=r.remarks||''; fields.forEach(f=>{let el=$('f_'+f.key); if(el)el.value=n(r[f.key])}); scrollTo(0,0)}
async function delRecord(id){if(!confirm('削除しますか？'))return; await api('/api/project/'+projectId+'/records/'+id,{method:'DELETE'}); loadRecords()}
function sortBy(k){if(sortKey===k)sortAsc=!sortAsc;else{sortKey=k;sortAsc=true}renderTable()}
function renderTable(){let arr=[...records].sort((a,b)=>{let av=a[sortKey],bv=b[sortKey]; if(typeof av==='number'||typeof bv==='number')return (Number(av||0)-Number(bv||0))*(sortAsc?1:-1); return String(av||'').localeCompare(String(bv||''))*(sortAsc?1:-1)}); let th=`<tr><th onclick="sortBy('pipe_no')">管No.</th><th onclick="sortBy('datetime')">日時</th>`+fields.filter(f=>f.show!==false).map(f=>`<th onclick="sortBy('${f.key}')">${f.label}</th>`).join('')+`<th>備考</th><th>操作</th></tr>`; let rows=arr.map(r=>`<tr><td>${n(r.pipe_no)}</td><td>${fmtDateTime(r.datetime)}</td>`+fields.filter(f=>f.show!==false).map(f=>`<td>${n(r[f.key])}</td>`).join('')+`<td>${n(r.remarks)}</td><td><button onclick="editRecord(${r.id})">編集</button><button onclick="delRecord(${r.id})">削除</button></td></tr>`).join(''); $('recordTable').innerHTML=th+rows;}

async function loadLub(){lub=await api('/api/project/'+projectId+'/lubricant'); $('lubMaterial').value=lub.materialName||'滑材'; $('lubDate').value=today(); renderLub()}
async function saveLubSettings(){await api('/api/project/'+projectId+'/lubricant/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({materialName:$('lubMaterial').value})}); loadLub()}
async function saveLub(){let body={date:$('lubDate').value,pipe:$('lubPipe').value,injection_l:$('lubInj').value,material_kg:$('lubMat').value,carry_kg:$('lubCarry').value,remarks:$('lubRemarks').value}; await api('/api/project/'+projectId+'/lubricant',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); ['lubPipe','lubInj','lubMat','lubCarry','lubRemarks'].forEach(id=>$(id).value=''); loadLub()}
function renderLub(){let m=lub.materialName||'材料'; let h=`<tr><th>日付</th><th>注入管No.</th><th>注入量ℓ</th><th>日注入計ℓ</th><th>累計注入ℓ</th><th>${m} kg</th><th>日使用計kg</th><th>累計使用kg</th><th>搬入量kg</th><th>総搬入kg</th><th>残数量kg</th><th style="min-width:220px">備考</th></tr>`; let rows=(lub.records||[]).map(r=>`<tr><td>${fmtDate(r.date)}</td><td>${n(r.pipe)}</td><td>${n(r.injection_l)}</td><td>${n(r.day_injection)}</td><td>${n(r.total_injection)}</td><td>${n(r.material_kg)}</td><td>${n(r.day_material)}</td><td>${n(r.total_material)}</td><td>${n(r.carry_kg)}</td><td>${n(r.total_carry)}</td><td>${n(r.remaining)}</td><td>${n(r.remarks)}</td></tr>`).join(''); $('lubTable').innerHTML=h+rows;}

function renderGraphFields(){let colors=['#e11d48','#2563eb','#16a34a','#f97316','#7c3aed','#0891b2','#ca8a04','#111827']; $('graphFields').innerHTML=fields.filter(f=>f.graph!==false).map((f,i)=>`<div class="colorrow"><label><input type="checkbox" class="gcheck" value="${f.key}"> ${f.label} ${f.unit?`(${f.unit})`:''}</label><input type="color" id="color_${f.key}" value="${colors[i%colors.length]}"><select id="axis_${f.key}"><option value="left">左軸</option><option value="right">右軸</option></select></div>`).join('')}
function getGraphSetting(){let series=[...document.querySelectorAll('.gcheck:checked')].map(c=>({key:c.value,color:$('color_'+c.value).value,axis:$('axis_'+c.value).value})); return {id:$('graphConfigSel').value&&$('graphConfigSel').value!=='new'?Number($('graphConfigSel').value):Date.now(),name:$('graphName').value||'グラフ設定',xAxis:$('xAxis').value,xAxisLabel:$('xAxisLabel').value,series};}
function applyGraphSetting(g){$('graphName').value=g.name||''; $('xAxis').value=g.xAxis||'pipe_no'; $('xAxisLabel').value=g.xAxisLabel||''; document.querySelectorAll('.gcheck').forEach(c=>c.checked=false); (g.series||[]).forEach(s=>{let c=document.querySelector(`.gcheck[value="${s.key}"]`); if(c)c.checked=true; if($('color_'+s.key))$('color_'+s.key).value=s.color||'#2563eb'; if($('axis_'+s.key))$('axis_'+s.key).value=s.axis||'left'}); drawGraph();}
function renderGraphConfigList(){let gs=currentProject.graphConfigs||[]; $('graphConfigSel').innerHTML='<option value="new">新規設定</option>'+gs.map(g=>`<option value="${g.id}">${g.name}</option>`).join('')}
function loadGraphConfig(){let id=$('graphConfigSel').value; if(id==='new')return; let g=(currentProject.graphConfigs||[]).find(x=>String(x.id)===String(id)); if(g)applyGraphSetting(g)}
async function saveGraphConfig(){let g=getGraphSetting(); if(!g.series.length)return alert('表示する値を選択してください'); let gs=[...(currentProject.graphConfigs||[])].filter(x=>x.id!==g.id); gs.push(g); await api('/api/project/'+projectId+'/graph-configs',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({graphConfigs:gs})}); currentProject.graphConfigs=gs; renderGraphConfigList(); $('graphConfigSel').value=g.id; alert('グラフ設定を保存しました');}
async function deleteGraphConfig(){let id=$('graphConfigSel').value;if(id==='new')return; let gs=(currentProject.graphConfigs||[]).filter(x=>String(x.id)!==String(id)); await api('/api/project/'+projectId+'/graph-configs',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({graphConfigs:gs})}); currentProject.graphConfigs=gs; renderGraphConfigList();}
function drawGraph(){let g=getGraphSetting(), svg=$('graphSvg'); svg.innerHTML=''; let W=1000,H=480,L=70,R=40,T=30,B=70; let data=[...records].sort((a,b)=>g.xAxis==='pipe_no'?(Number(a.pipe_no||0)-Number(b.pipe_no||0)):String(a.datetime||'').localeCompare(String(b.datetime||''))); let series=g.series.filter(s=>data.some(r=>r[s.key]!=null&&r[s.key]!=='')); if(!data.length||!series.length){svg.innerHTML='<text x="40" y="60">データまたは表示項目を選択してください</text>';return}
 let xs=data.map((r,i)=>g.xAxis==='pipe_no'?Number(r.pipe_no||i+1):i); let xmin=Math.min(...xs), xmax=Math.max(...xs); if(xmin===xmax){xmin-=1;xmax+=1}
 let vals=series.flatMap(s=>data.map(r=>Number(r[s.key])).filter(v=>!isNaN(v))); let ymin=Math.min(...vals), ymax=Math.max(...vals); if(ymin===ymax){ymin-=1;ymax+=1} let pad=(ymax-ymin)*.08; ymin-=pad;ymax+=pad;
 let xmap=(x)=>L+(Number(x)-xmin)/(xmax-xmin)*(W-L-R), ymap=(y)=>H-B-(Number(y)-ymin)/(ymax-ymin)*(H-T-B);
 let add=(tag,attrs)=>{let e=document.createElementNS('http://www.w3.org/2000/svg',tag); Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v)); svg.appendChild(e); return e}
 add('line',{x1:L,y1:T,x2:L,y2:H-B,stroke:'#333'}); add('line',{x1:L,y1:H-B,x2:W-R,y2:H-B,stroke:'#333'});
 for(let i=0;i<=5;i++){let y=T+i*(H-T-B)/5; add('line',{x1:L,y1:y,x2:W-R,y2:y,stroke:'#ddd'}); let val=(ymax-(ymax-ymin)*i/5).toFixed(2); add('text',{x:10,y:y+4,'font-size':12}).textContent=val}
 data.forEach((r,i)=>{if(i%Math.ceil(data.length/10)!==0)return; let x=xmap(xs[i]); add('text',{x:x,y:H-35,'font-size':11,'text-anchor':'middle',transform:`rotate(45 ${x} ${H-35})`}).textContent=g.xAxis==='pipe_no'?n(r.pipe_no):fmtDate(r.datetime)});
 add('text',{x:W/2,y:H-5,'font-size':14,'text-anchor':'middle'}).textContent=g.xAxisLabel||(g.xAxis==='pipe_no'?'推進管No.':'日付');
 series.forEach(s=>{let pts=data.map((r,i)=>{let v=Number(r[s.key]); if(isNaN(v))return null; return [xmap(xs[i]),ymap(v)]}).filter(Boolean); if(!pts.length)return; add('polyline',{points:pts.map(p=>p.join(',')).join(' '),fill:'none',stroke:s.color,'stroke-width':2}); pts.forEach(p=>add('circle',{cx:p[0],cy:p[1],r:3,fill:s.color}));});
 $('legend').innerHTML=series.map(s=>{let f=fields.find(x=>x.key===s.key)||{}; return `<div><span style="background:${s.color}"></span>${f.label||s.key}</div>`}).join('');
}
function downloadSvg(){let blob=new Blob([$('graphSvg').outerHTML],{type:'image/svg+xml'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='graph.svg'; a.click();}

function renderSettings(){let s=currentProject.settings||{}; $('setTitle').value=s.title||'';$('setWork').value=s.workName||'';$('setContractor').value=s.contractor||'';$('setSpan').value=s.spanName||'';$('setDia').value=s.diameter||'';$('setDist').value=s.distance||'';$('setWriter').value=s.writer||''; $('setPerPage').value=s.printPerPage||10; $('fieldSettings').innerHTML=fields.map(f=>`<div class="grid"><input id="o_${f.key}" type="number" value="${f.order||0}"><input id="l_${f.key}" value="${f.label}"><input id="u_${f.key}" value="${f.unit||''}"><label><input id="sh_${f.key}" type="checkbox" ${f.show!==false?'checked':''}>入力表示</label><label><input id="pr_${f.key}" type="checkbox" ${f.print!==false?'checked':''}>印刷表示</label><label><input id="gr_${f.key}" type="checkbox" ${f.graph!==false?'checked':''}>グラフ対象</label></div>`).join('')}
async function saveSettings(){let logo=currentProject.settings.logo||''; let file=$('logoFile').files[0]; if(file)logo=await new Promise(res=>{let fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(file)}); let body={title:$('setTitle').value,workName:$('setWork').value,contractor:$('setContractor').value,spanName:$('setSpan').value,diameter:$('setDia').value,distance:$('setDist').value,writer:$('setWriter').value,printPerPage:Number($('setPerPage').value||10),logo}; await api('/api/project/'+projectId+'/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); await loadProject(); alert('保存しました')}
async function saveFields(){fields=fields.map(f=>({...f,order:Number($('o_'+f.key).value||0),label:$('l_'+f.key).value,unit:$('u_'+f.key).value,show:$('sh_'+f.key).checked,print:$('pr_'+f.key).checked,graph:$('gr_'+f.key).checked})); await api('/api/project/'+projectId+'/fields',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields})}); await loadProject(); alert('保存しました')}

function printDrive(){
 let s=currentProject.settings||{};
 let pf=fields.filter(f=>f.print!==false);
 let per=Math.max(1, Math.min(20, Number(s.printPerPage||10)));
 let sorted=[...records].sort((a,b)=>Number(a.pipe_no||0)-Number(b.pipe_no||0) || String(a.datetime||'').localeCompare(String(b.datetime||'')));
 let chunks=[]; for(let i=0;i<sorted.length;i+=per)chunks.push(sorted.slice(i,i+per)); if(!chunks.length)chunks=[[]];
 const blank={};
 const meta=`<table class="printMeta">
  <tr><th>工事名</th><td colspan="3">${n(s.workName)}</td><th>施工者</th><td colspan="3">${n(s.contractor)}</td><th>記入者</th><td>${n(s.writer)}</td></tr>
  <tr><th>スパン名</th><td colspan="3">${n(s.spanName)}</td><th>管径</th><td colspan="2">${n(s.diameter)}</td><th>推進距離</th><td colspan="2">${n(s.distance)}</td></tr>
 </table>`;
 $('printArea').innerHTML=chunks.map(ch=>{
   let cols=[...ch]; while(cols.length<per)cols.push(blank);
   return `<div class="page"><h2 style="text-align:center;margin:2mm 0 1mm 0">${s.title||'泥水式推進工データー表'}</h2>${meta}
   <table class="drivePrintTable">
    <tr><th>項目</th>${cols.map(r=>`<th>${n(r.pipe_no)}</th>`).join('')}</tr>
    <tr><td>日付</td>${cols.map(r=>`<td>${fmtDateTime(r.datetime)}</td>`).join('')}</tr>
    ${pf.map(f=>`<tr><td>${f.label}${f.unit?`（${f.unit}）`:''}</td>${cols.map(r=>`<td>${n(r[f.key])}</td>`).join('')}</tr>`).join('')}
    <tr class="driveRemarkRow"><td>特記事項</td>${cols.map(r=>`<td>${n(r.remarks)}</td>`).join('')}</tr>
   </table>${s.logo?`<img class="printLogo" src="${s.logo}">`:''}</div>`;
 }).join('');
 window.print();
}
